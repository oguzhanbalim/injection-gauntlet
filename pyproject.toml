[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "injection-gauntlet"
version = "0.1.0"
description = "A prompt-injection test bench for tool-using agents, scored by canaries rather than opinions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Oğuzhan Balım" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
injection-gauntlet = "injection_gauntlet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/injection_gauntlet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
